<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRM - Lead Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-50">
    <div x-data="crmApp()" x-init="init()" class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <h1 class="text-2xl font-bold text-gray-900">Simple CRM</h1>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-500">Total Leads: <span x-text="leads.length" class="font-bold"></span></span>
                        <button @click="showAddLead = true" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            + Add Lead
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Stats Dashboard -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-sm text-gray-500">New Leads</div>
                    <div class="text-3xl font-bold text-gray-900" x-text="getLeadsByStatus('new').length">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-sm text-gray-500">In Progress</div>
                    <div class="text-3xl font-bold text-blue-600" x-text="getLeadsByStatus('contacted').length + getLeadsByStatus('qualified').length">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-sm text-gray-500">Won Deals</div>
                    <div class="text-3xl font-bold text-green-600" x-text="getLeadsByStatus('won').length">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-sm text-gray-500">Pipeline Value</div>
                    <div class="text-3xl font-bold text-purple-600">$<span x-text="calculatePipelineValue()">0</span></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
            <!-- Filters -->
            <div class="bg-white rounded-lg shadow mb-6 p-4">
                <div class="flex flex-wrap gap-4">
                    <select x-model="filterStatus" @change="filterLeads()" class="border rounded-lg px-4 py-2">
                        <option value="">All Status</option>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="qualified">Qualified</option>
                        <option value="proposal">Proposal</option>
                        <option value="negotiation">Negotiation</option>
                        <option value="won">Won</option>
                        <option value="lost">Lost</option>
                        <option value="nurture">Nurture</option>
                    </select>
                    <input type="text" x-model="searchTerm" @input="filterLeads()" placeholder="Search leads..." class="border rounded-lg px-4 py-2 flex-1">
                </div>
            </div>

            <!-- Leads Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Business</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Next Follow-up</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Value</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="lead in filteredLeads" :key="lead.id">
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" x-text="lead.business_name"></div>
                                    <div class="text-sm text-gray-500" x-text="lead.industry"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm text-gray-900" x-text="lead.contact_name"></div>
                                    <div class="text-sm text-gray-500" x-text="lead.email"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span x-text="lead.status" :class="getStatusColor(lead.status)" class="px-2 py-1 text-xs rounded-full"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div class="text-sm font-medium text-gray-900" x-text="lead.lead_score || 0"></div>
                                        <div class="ml-2 w-16 bg-gray-200 rounded-full h-2">
                                            <div class="bg-blue-600 h-2 rounded-full" :style="`width: ${lead.lead_score || 0}%`"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="formatDate(lead.next_follow_up_date)"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                    $<span x-text="lead.estimated_value || 0"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm">
                                    <button @click="editLead(lead)" class="text-blue-600 hover:text-blue-900 mr-2">Edit</button>
                                    <button @click="addInteraction(lead)" class="text-green-600 hover:text-green-900 mr-2">Log</button>
                                    <button @click="deleteLead(lead.id)" class="text-red-600 hover:text-red-900">Delete</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add/Edit Lead Modal -->
        <div x-show="showAddLead" x-cloak class="fixed inset-0 z-50 overflow-y-auto">
            <div class="flex items-center justify-center min-h-screen px-4">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75" @click="showAddLead = false"></div>
                <div class="relative bg-white rounded-lg max-w-2xl w-full p-6">
                    <h2 class="text-xl font-bold mb-4" x-text="editingLead ? 'Edit Lead' : 'Add New Lead'"></h2>
                    <form @submit.prevent="saveLead()">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Business Name*</label>
                                <input type="text" x-model="currentLead.business_name" required class="mt-1 block w-full border rounded-lg px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Contact Name</label>
                                <input type="text" x-model="currentLead.contact_name" class="mt-1 block w-full border rounded-lg px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Email*</label>
                                <input type="email" x-model="currentLead.email" required class="mt-1 block w-full border rounded-lg px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Phone</label>
                                <input type="tel" x-model="currentLead.phone" class="mt-1 block w-full border rounded-lg px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Industry</label>
                                <select x-model="currentLead.business_type" class="mt-1 block w-full border rounded-lg px-3 py-2">
                                    <option value="">Select...</option>
                                    <option value="cafe">Cafe</option>
                                    <option value="restaurant">Restaurant</option>
                                    <option value="retail">Retail</option>
                                    <option value="service">Service</option>
                                    <option value="ecommerce">E-commerce</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Status</label>
                                <select x-model="currentLead.status" class="mt-1 block w-full border rounded-lg px-3 py-2">
                                    <option value="new">New</option>
                                    <option value="contacted">Contacted</option>
                                    <option value="qualified">Qualified</option>
                                    <option value="proposal">Proposal</option>
                                    <option value="negotiation">Negotiation</option>
                                    <option value="won">Won</option>
                                    <option value="lost">Lost</option>
                                    <option value="nurture">Nurture</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Estimated Value</label>
                                <input type="number" x-model="currentLead.estimated_value" class="mt-1 block w-full border rounded-lg px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Next Follow-up</label>
                                <input type="date" x-model="currentLead.next_follow_up_date" class="mt-1 block w-full border rounded-lg px-3 py-2">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700">Notes</label>
                                <textarea x-model="currentLead.notes" rows="3" class="mt-1 block w-full border rounded-lg px-3 py-2"></textarea>
                            </div>
                        </div>
                        <div class="mt-6 flex justify-end space-x-3">
                            <button type="button" @click="showAddLead = false" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</button>
                            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Lead</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function crmApp() {
            return {
                supabase: null,
                leads: [],
                filteredLeads: [],
                currentLead: {},
                editingLead: false,
                showAddLead: false,
                filterStatus: '',
                searchTerm: '',

                async init() {
                    // Initialize Supabase - Replace with your credentials
                    this.supabase = supabase.createClient(
                        'YOUR_SUPABASE_URL',
                        'YOUR_SUPABASE_ANON_KEY'
                    );

                    // For demo, use local storage
                    this.loadLeadsFromStorage();
                },

                loadLeadsFromStorage() {
                    const stored = localStorage.getItem('crm_leads');
                    this.leads = stored ? JSON.parse(stored) : this.getDemoLeads();
                    this.filteredLeads = [...this.leads];
                },

                saveLeadsToStorage() {
                    localStorage.setItem('crm_leads', JSON.stringify(this.leads));
                },

                getDemoLeads() {
                    return [
                        {
                            id: '1',
                            business_name: 'Coffee Culture',
                            contact_name: 'Sarah Johnson',
                            email: 'sarah@coffeeculture.com',
                            phone: '555-0101',
                            business_type: 'cafe',
                            industry: 'Food & Beverage',
                            status: 'qualified',
                            lead_score: 75,
                            estimated_value: 497,
                            next_follow_up_date: '2025-08-20',
                            notes: 'Interested in Instagram automation'
                        },
                        {
                            id: '2',
                            business_name: 'Urban Grind',
                            contact_name: 'Mike Chen',
                            email: 'mike@urbangrind.com',
                            phone: '555-0102',
                            business_type: 'cafe',
                            industry: 'Food & Beverage',
                            status: 'proposal',
                            lead_score: 85,
                            estimated_value: 497,
                            next_follow_up_date: '2025-08-19',
                            notes: 'Sent proposal, following up tomorrow'
                        },
                        {
                            id: '3',
                            business_name: 'Bella Vista Restaurant',
                            contact_name: 'Antonio Rossi',
                            email: 'antonio@bellavista.com',
                            phone: '555-0103',
                            business_type: 'restaurant',
                            industry: 'Food & Beverage',
                            status: 'new',
                            lead_score: 40,
                            estimated_value: 697,
                            next_follow_up_date: '2025-08-21',
                            notes: 'Premium package potential'
                        }
                    ];
                },

                filterLeads() {
                    this.filteredLeads = this.leads.filter(lead => {
                        const matchesStatus = !this.filterStatus || lead.status === this.filterStatus;
                        const matchesSearch = !this.searchTerm || 
                            lead.business_name.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                            lead.contact_name?.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                            lead.email.toLowerCase().includes(this.searchTerm.toLowerCase());
                        return matchesStatus && matchesSearch;
                    });
                },

                getLeadsByStatus(status) {
                    return this.leads.filter(lead => lead.status === status);
                },

                calculatePipelineValue() {
                    return this.leads
                        .filter(lead => ['qualified', 'proposal', 'negotiation'].includes(lead.status))
                        .reduce((sum, lead) => sum + (parseFloat(lead.estimated_value) || 0), 0);
                },

                getStatusColor(status) {
                    const colors = {
                        new: 'bg-gray-100 text-gray-800',
                        contacted: 'bg-blue-100 text-blue-800',
                        qualified: 'bg-yellow-100 text-yellow-800',
                        proposal: 'bg-orange-100 text-orange-800',
                        negotiation: 'bg-purple-100 text-purple-800',
                        won: 'bg-green-100 text-green-800',
                        lost: 'bg-red-100 text-red-800',
                        nurture: 'bg-gray-100 text-gray-800'
                    };
                    return colors[status] || 'bg-gray-100 text-gray-800';
                },

                formatDate(date) {
                    if (!date) return '-';
                    return new Date(date).toLocaleDateString();
                },

                editLead(lead) {
                    this.currentLead = { ...lead };
                    this.editingLead = true;
                    this.showAddLead = true;
                },

                addInteraction(lead) {
                    // Placeholder for interaction logging
                    alert(`Log interaction for ${lead.business_name}`);
                },

                saveLead() {
                    if (this.editingLead) {
                        const index = this.leads.findIndex(l => l.id === this.currentLead.id);
                        if (index > -1) {
                            this.leads[index] = this.currentLead;
                        }
                    } else {
                        this.currentLead.id = Date.now().toString();
                        this.currentLead.status = this.currentLead.status || 'new';
                        this.currentLead.lead_score = 0;
                        this.leads.push(this.currentLead);
                    }
                    
                    this.saveLeadsToStorage();
                    this.filterLeads();
                    this.showAddLead = false;
                    this.currentLead = {};
                    this.editingLead = false;
                },

                deleteLead(id) {
                    if (confirm('Are you sure you want to delete this lead?')) {
                        this.leads = this.leads.filter(l => l.id !== id);
                        this.saveLeadsToStorage();
                        this.filterLeads();
                    }
                }
            };
        }
    </script>
</body>
</html>
