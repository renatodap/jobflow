<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="g3" cx="30%" cy="50%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#312E81"/>
    </radialGradient>
    <linearGradient id="g1-horizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#4338CA"/>
    </linearGradient>
  </defs>
  
  <!-- Background with Subtle Radial Gradient -->
  <rect width="1200" height="630" fill="url(#g3)"/>
  
  <!-- Content Safe Zone Overlay -->
  <rect x="100" y="100" width="1000" height="430" fill="white" fill-opacity="0.05" rx="16"/>
  
  <!-- Icon Container -->
  <circle cx="250" cy="315" r="60" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Icon Placeholder -->
  <text x="250" y="325" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="white" text-anchor="middle">
    [ICON]
  </text>
  
  <!-- Title Text -->
  <text x="420" y="300" font-family="Inter, sans-serif" font-size="56" font-weight="600" fill="white">
    [BLOG POST TITLE]
  </text>
  
  <!-- Subtitle/Description -->
  <text x="420" y="350" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="white" fill-opacity="0.8">
    [POST DESCRIPTION]
  </text>
  
  <!-- Accent Line -->
  <rect x="420" y="380" width="120" height="4" fill="url(#g1-horizontal)"/>
  
  <!-- Post Type Badge -->
  <g transform="translate(420, 420)">
    <rect width="120" height="36" rx="18" fill="white" fill-opacity="0.15"/>
    <text x="60" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
      [POST TYPE]
    </text>
  </g>
  
  <!-- Reading Time -->
  <text x="560" y="444" font-family="Space Mono, monospace" font-size="14" font-weight="400" fill="white" fill-opacity="0.7">
    [X] min read
  </text>
  
  <!-- Bottom Brand -->
  <text x="1050" y="580" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="white" fill-opacity="0.5" text-anchor="end">
    AI-Daily | renatodap.me
  </text>
</svg>