<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Framework Post Type (T1) Cover Variant -->
  <defs>
    <linearGradient id="framework-gradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(18)">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#4338CA"/>
    </linearGradient>
    <pattern id="grid-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#framework-gradient)"/>
  <rect width="1200" height="630" fill="url(#grid-pattern)"/>
  
  <!-- Framework Icon (layer-3d) -->
  <g transform="translate(150, 265)">
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <rect x="10" y="10" width="80" height="80" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <rect x="20" y="20" width="80" height="80" fill="none" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Title Area -->
  <text x="350" y="280" font-family="Inter, sans-serif" font-size="48" font-weight="600" fill="white">
    Use X When A/B,
  </text>
  <text x="350" y="340" font-family="Inter, sans-serif" font-size="48" font-weight="600" fill="white">
    Avoid When C
  </text>
  
  <!-- Post Type Badge -->
  <g transform="translate(350, 380)">
    <rect width="140" height="40" rx="20" fill="white" fill-opacity="0.2"/>
    <text x="70" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
      FRAMEWORK
    </text>
  </g>
  
  <!-- Reading Time -->
  <text x="520" y="406" font-family="Space Mono, monospace" font-size="14" font-weight="400" fill="white" opacity="0.8">
    3 min read
  </text>
  
  <!-- Bottom Branding -->
  <text x="1050" y="580" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="white" opacity="0.6" text-anchor="end">
    AI-Daily | renatodap.me
  </text>
</svg>