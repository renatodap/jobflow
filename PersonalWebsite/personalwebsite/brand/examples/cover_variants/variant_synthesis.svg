<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Synthesis Post Type (T3) Cover Variant -->
  <defs>
    <radialGradient id="synthesis-gradient" cx="30%" cy="50%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#312E81"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#synthesis-gradient)"/>
  
  <!-- Comparison Icon (scales) -->
  <g transform="translate(150, 265)">
    <!-- Scale base -->
    <line x1="50" y1="100" x2="50" y2="20" stroke="white" stroke-width="3"/>
    <line x1="20" y1="100" x2="80" y2="100" stroke="white" stroke-width="3"/>
    
    <!-- Scale arms -->
    <line x1="50" y1="40" x2="10" y2="60" stroke="white" stroke-width="2"/>
    <line x1="50" y1="40" x2="90" y2="60" stroke="white" stroke-width="2"/>
    
    <!-- Scale plates -->
    <ellipse cx="10" cy="65" rx="15" ry="3" fill="none" stroke="white" stroke-width="2"/>
    <ellipse cx="90" cy="55" rx="15" ry="3" fill="none" stroke="white" stroke-width="2"/>
    
    <!-- Items being weighed -->
    <circle cx="10" cy="60" r="5" fill="white" opacity="0.8"/>
    <rect x="82" y="47" width="16" height="6" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Title -->
  <text x="350" y="280" font-family="Inter, sans-serif" font-size="48" font-weight="600" fill="white">
    Free vs Paid:
  </text>
  <text x="350" y="340" font-family="Inter, sans-serif" font-size="48" font-weight="600" fill="white">
    The 90% Truth
  </text>
  
  <!-- Keep/Ditch/When Badges -->
  <g transform="translate(350, 380)">
    <rect width="80" height="36" rx="8" fill="#14B8A6"/>
    <text x="40" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
      KEEP
    </text>
  </g>
  
  <g transform="translate(440, 380)">
    <rect width="80" height="36" rx="8" fill="#0F172A"/>
    <text x="40" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
      DITCH
    </text>
  </g>
  
  <g transform="translate(530, 380)">
    <rect width="80" height="36" rx="8" fill="white" fill-opacity="0.2"/>
    <text x="40" y="24" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
      WHEN
    </text>
  </g>
  
  <!-- Reading Time -->
  <text x="350" y="450" font-family="Space Mono, monospace" font-size="14" font-weight="400" fill="white" opacity="0.7">
    Synthesis • 4 min read
  </text>
  
  <!-- Bottom -->
  <text x="1050" y="580" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="white" opacity="0.6" text-anchor="end">
    AI-Daily | renatodap.me
  </text>
</svg>